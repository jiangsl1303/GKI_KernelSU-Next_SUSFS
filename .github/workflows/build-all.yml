name: Build All Kernels

# ============================================================================
# Build every GKI profile in the repo as a matrix, publish a combined Release.
#
# Triggers:
#   - schedule: every Monday 02:00 UTC (10:00 Beijing time)
#   - workflow_dispatch: manual run, with option to skip Release
# ============================================================================

on:
  schedule:
    # Every Monday at 02:00 UTC = 10:00 CST (Beijing)
    - cron: '0 2 * * 1'

  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a combined GitHub Release with all artifacts"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------- build
  # One job per profile, building in-place (not via reusable workflow call).
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: config/android13-5.10.env
            label: android13-5.10
          - profile: config/android13-5.15.env
            label: android13-5.15
          - profile: config/android14-6.1.env
            label: android14-6.1
          - profile: config/android15-6.6.env
            label: android15-6.6
          - profile: config/android16-6.12.env
            label: android16-6.12
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: ${{ matrix.profile }}
      IN_KSU_VARIANT: kernelsu-next
    steps:
      - uses: actions/checkout@v4

      - name: Resolve configuration
        run: bash scripts/config.sh

      - name: Free up disk space
        if: env.REMOVE_UNUSED_PACKAGES == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make patch python3 rsync unzip zip zstd \
            libncurses-dev libdw-dev dwarves pkg-config
          # pahole (from dwarves) is required by CONFIG_DEBUG_INFO_BTF.
          # libdw-dev provides dwarf.h, required by gendwarfksyms on Linux 6.12+.
          command -v pahole >/dev/null || sudo apt-get install -y pahole
          mkdir -p "$WORKSPACE"

      # Linux 6.12 emits BTF that pahole 1.25 (Ubuntu noble) cannot round-trip:
      # `make vmlinux` dies at `BTFIDS vmlinux` with
      # "FAILED: load BTF from vmlinux: Invalid argument". 5.10 / 5.15 / 6.1 /
      # 6.6 are fine with the distro pahole, so only 6.12 pays for the build.
      - name: Build pahole from source (6.12+)
        if: matrix.label == 'android16-6.12'
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends cmake zlib1g-dev libbz2-dev
          git clone -q --depth=1 https://github.com/acmel/dwarves.git "$RUNNER_TEMP/dwarves"
          cmake -S "$RUNNER_TEMP/dwarves" -B "$RUNNER_TEMP/dwarves/build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/dwarves/build" -j"$(nproc --all)"
          sudo cmake --install "$RUNNER_TEMP/dwarves/build"
          hash -r
          echo "pahole now: $(command -v pahole)"
          pahole --version
          case "$(command -v pahole)" in
            /usr/local/bin/*) echo "ok: /usr/local/bin/pahole wins over apt's 1.25" ;;
            *) echo "::warning::/usr/local/bin/pahole is not first in PATH; 6.12 BTF will be disabled" ;;
          esac

      - name: Verify build tools
        run: |
          set -euo pipefail
          rc=0
          for t in pahole bc bison flex ccache cpio dtc lz4 zstd make patch python3; do
            p=$(command -v "$t" 2>/dev/null || true)
            if [ -n "$p" ]; then
              printf '  %-8s %s\n' "$t" "$p"
            else
              printf '  %-8s MISSING\n' "$t"
              rc=1
            fi
          done
          if [ -f /usr/include/dwarf.h ]; then
            echo "  dwarf.h  /usr/include/dwarf.h"
          else
            echo "  dwarf.h  MISSING (needed by gendwarfksyms on 6.12+)"
          fi
          pahole --version || true
          exit "$rc"

      - name: Set up toolchain
        run: bash scripts/toolchain.sh

      - name: Fetch kernel source
        run: bash scripts/source.sh

      - name: Install KernelSU-Next
        if: env.KSU_VARIANT != 'none'
        run: bash scripts/kernelsu.sh

      - name: Apply kernel patches
        run: bash scripts/patches.sh

      # ccache is an accelerator, never a build dependency. A third-party
      # action here once failed in 1s and killed all 5 matrix jobs before the
      # compiler ever ran, so the cache is restored with the first-party
      # actions/cache and configured with plain shell. Both are non-fatal.
      - name: Restore ccache
        if: env.ENABLE_CCACHE == 'true'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKSPACE }}/.ccache
          key: ccache-${{ matrix.label }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.label }}-
            ccache-

      - name: Configure ccache
        if: env.ENABLE_CCACHE == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE/.ccache"
          export CCACHE_DIR="$WORKSPACE/.ccache"
          {
            echo "CCACHE_DIR=$WORKSPACE/.ccache"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_HARDLINK=false"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          ccache --version | head -n1 || true
          ccache -o max_size=2G || true
          ccache -o hard_link=false || true
          ccache -z || true

      - name: Build kernel
        run: bash scripts/build.sh all

      - name: Package artifacts
        run: bash scripts/package.sh all

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-GKI${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error

      - name: Upload kernel image
        if: env.CHECK_FILE_IS_OK == 'true' && env.UPLOAD_RAW_IMAGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Image-GKI${{ env.LOCALVERSION }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}
          if-no-files-found: error

      - name: Upload SUSFS LKM
        if: env.SUSFS_KO != ''
        uses: actions/upload-artifact@v4
        with:
          name: susfs_guard_lkm-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: ${{ env.SUSFS_KO }}
          if-no-files-found: error

  # ------------------------------------------------------------------ release
  # Collect all artifacts from the matrix builds and publish a single Release.
  release:
    name: Publish combined release
    needs: build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set build date
        id: date
        run: echo "build_date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Organize and package artifacts
        run: |
          set -euo pipefail
          mkdir -p release

          {
            echo "### Artifacts downloaded:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          for dir in artifacts/*/; do
            name=$(basename "${dir%/}")
            echo "- $name" >> "$GITHUB_STEP_SUMMARY"

            if [ -f "${dir}anykernel.sh" ] || [ -d "${dir}tools" ]; then
              (cd "$dir" && zip -qr9 "${GITHUB_WORKSPACE}/release/${name}.zip" .)
              echo "  -> packaged as ${name}.zip"
            else
              for f in "${dir}"*; do
                [ -f "$f" ] && cp "$f" "release/$(basename "$f")"
              done
            fi
          done

          {
            echo ""
            echo "### Release contents:"
            echo ""
            echo '```'
            ls -la release/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create combined release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: gki-all-${{ steps.date.outputs.build_date }}
          name: GKI All Profiles · ${{ steps.date.outputs.build_date }}
          body: |
            ## GKI KernelSU-Next + SUSFS — All Profiles Build

            **Build date:** ${{ steps.date.outputs.build_date }}
            **Profiles built:** 5

            ### Downloads

            Each `AnyKernel3-*.zip` is a flashable package for the corresponding GKI kernel version.
            Pick the one matching your device's Android / kernel version:

            | File | Kernel | Android |
            | --- | --- | --- |
            | AnyKernel3-*-android13-5.10-* | Linux 5.10 | Android 13 |
            | AnyKernel3-*-android13-5.15-* | Linux 5.15 | Android 13 |
            | AnyKernel3-*-android14-6.1-*  | Linux 6.1  | Android 14 |
            | AnyKernel3-*-android15-6.6-*  | Linux 6.6  | Android 15 |
            | AnyKernel3-*-android16-6.12-* | Linux 6.12 | Android 16 |

            ### Flashing

            1. Flash the `AnyKernel3-*.zip` from a custom recovery (TWRP/OrangeFox) or with KernelFlasher.
            2. After boot, install the [KernelSU-Next manager](https://github.com/KernelSU-Next/KernelSU-Next/releases).
            3. Load SUSFS: `ksud insmod /data/adb/ksu/susfs_guard_lkm.ko`

            ### Notes

            - These are **generic GKI** kernels — they work on devices whose boot partition
              accepts a GKI kernel (Pixel, most GSI/custom-ROM phones). Device-specific vendor
              kernels (OnePlus, Samsung, etc.) need a separate profile under `config/`.
            - SUSFS is built as an LKM (`susfs_guard_lkm.ko`) and loaded at runtime; it is
              included inside each AnyKernel3 zip under `/data/adb/ksu/`.
            - Built automatically every Monday 10:00 CST, or on manual trigger.
          files: release/*
          make_latest: true
