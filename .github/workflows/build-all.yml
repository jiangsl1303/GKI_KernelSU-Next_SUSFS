name: Build All Kernels

# ============================================================================
# Build every GKI profile in the repo as a matrix, publish a combined Release.
#
# Triggers:
#   - schedule: every Monday 02:00 UTC (10:00 Beijing time)
#   - workflow_dispatch: manual run, with option to skip Release
# ============================================================================

on:
  schedule:
    # Every Monday at 02:00 UTC = 10:00 CST (Beijing)
    - cron: '0 2 * * 1'

  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a combined GitHub Release with all artifacts"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------- build
  # One job per profile, building in-place (not via reusable workflow call).
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: config/android13-5.10.env
            label: android13-5.10
          - profile: config/android13-5.15.env
            label: android13-5.15
          - profile: config/android14-6.1.env
            label: android14-6.1
          - profile: config/android15-6.6.env
            label: android15-6.6
          - profile: config/android16-6.12.env
            label: android16-6.12
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: ${{ matrix.profile }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      IN_KSU_VARIANT: kernelsu-next
    steps:
      - uses: actions/checkout@v4

      - name: Resolve configuration
        run: bash scripts/config.sh

      - name: Free up disk space
        if: env.REMOVE_UNUSED_PACKAGES == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev
          mkdir -p "$WORKSPACE"

      - name: Set up toolchain
        run: bash scripts/toolchain.sh

      - name: Fetch kernel source
        run: bash scripts/source.sh

      - name: Install KernelSU-Next
        if: env.KSU_VARIANT != 'none'
        run: bash scripts/kernelsu.sh

      - name: Apply kernel patches
        run: bash scripts/patches.sh

      - name: Set up ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ env.DEVICE }}-${{ env.KSU_VARIANT }}-${{ env.KSU_REF_RESOLVED }}
          max-size: 2G

      - name: Build kernel
        run: bash scripts/build.sh all

      - name: Package artifacts
        run: bash scripts/package.sh all

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-GKI${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error

      - name: Upload kernel image
        if: env.CHECK_FILE_IS_OK == 'true' && env.UPLOAD_RAW_IMAGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Image-GKI${{ env.LOCALVERSION }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}
          if-no-files-found: error

      - name: Upload SUSFS LKM
        if: env.SUSFS_KO != ''
        uses: actions/upload-artifact@v4
        with:
          name: susfs_guard_lkm-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: ${{ env.SUSFS_KO }}
          if-no-files-found: error

  # ------------------------------------------------------------------ release
  # Collect all artifacts from the matrix builds and publish a single Release.
  release:
    name: Publish combined release
    needs: build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set build date
        id: date
        run: echo "build_date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Organize and package artifacts
        run: |
          set -euo pipefail
          mkdir -p release

          {
            echo "### Artifacts downloaded:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          for dir in artifacts/*/; do
            name=$(basename "${dir%/}")
            echo "- $name" >> "$GITHUB_STEP_SUMMARY"

            if [ -f "${dir}anykernel.sh" ] || [ -d "${dir}tools" ]; then
              (cd "$dir" && zip -qr9 "${GITHUB_WORKSPACE}/release/${name}.zip" .)
              echo "  -> packaged as ${name}.zip"
            else
              for f in "${dir}"*; do
                [ -f "$f" ] && cp "$f" "release/$(basename "$f")"
              done
            fi
          done

          {
            echo ""
            echo "### Release contents:"
            echo ""
            echo '```'
            ls -la release/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create combined release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: gki-all-${{ steps.date.outputs.build_date }}
          name: GKI All Profiles · ${{ steps.date.outputs.build_date }}
          body: |
            ## GKI KernelSU-Next + SUSFS — All Profiles Build

            **Build date:** ${{ steps.date.outputs.build_date }}
            **Profiles built:** 5

            ### Downloads

            Each `AnyKernel3-*.zip` is a flashable package for the corresponding GKI kernel version.
            Pick the one matching your device's Android / kernel version:

            | File | Kernel | Android |
            | --- | --- | --- |
            | AnyKernel3-*-android13-5.10-* | Linux 5.10 | Android 13 |
            | AnyKernel3-*-android13-5.15-* | Linux 5.15 | Android 13 |
            | AnyKernel3-*-android14-6.1-*  | Linux 6.1  | Android 14 |
            | AnyKernel3-*-android15-6.6-*  | Linux 6.6  | Android 15 |
            | AnyKernel3-*-android16-6.12-* | Linux 6.12 | Android 16 |

            ### Flashing

            1. Flash the `AnyKernel3-*.zip` from a custom recovery (TWRP/OrangeFox) or with KernelFlasher.
            2. After boot, install the [KernelSU-Next manager](https://github.com/KernelSU-Next/KernelSU-Next/releases).
            3. Load SUSFS: `ksud insmod /data/adb/ksu/susfs_guard_lkm.ko`

            ### Notes

            - These are **generic GKI** kernels — they work on devices whose boot partition
              accepts a GKI kernel (Pixel, most GSI/custom-ROM phones). Device-specific vendor
              kernels (OnePlus, Samsung, etc.) need a separate profile under `config/`.
            - SUSFS is built as an LKM (`susfs_guard_lkm.ko`) and loaded at runtime; it is
              included inside each AnyKernel3 zip under `/data/adb/ksu/`.
            - Built automatically every Monday 10:00 CST, or on manual trigger.
          files: release/*
          make_latest: true
