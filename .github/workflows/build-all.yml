name: Build All Kernels

# ============================================================================
# Build every GKI profile in the repo as a matrix, publish a combined Release.
#
# Triggers:
#   - schedule: every Monday 02:00 UTC (10:00 Beijing time)
#   - workflow_dispatch: manual run, with options to skip Release and choose
#     a subset of profiles
# ============================================================================

on:
  schedule:
    # Every Monday at 02:00 UTC = 10:00 CST (Beijing)
    - cron: '0 2 * * 1'

  workflow_dispatch:
    inputs:
      profiles:
        description: "Profiles to build (comma-separated, blank = all)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish a combined GitHub Release with all artifacts"
        required: false
        default: true
        type: boolean
      ksu_ref:
        description: "KernelSU-Next ref override (blank = profile default: dev)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
jobs:
  # -------------------------------------------------------------------- build
  # One job per profile, calling the reusable build-kernel workflow.
  # The matrix is hardcoded because GitHub Actions does not support dynamic
  # matrix generation (fromJson) on reusable workflow_call jobs.
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: config/android13-5.10.env
            label: android13-5.10
          - profile: config/android13-5.15.env
            label: android13-5.15
          - profile: config/android14-6.1.env
            label: android14-6.1
          - profile: config/android15-6.6.env
            label: android15-6.6
          - profile: config/android16-6.12.env
            label: android16-6.12
    uses: ./.github/workflows/build-kernel.yml
    with:
      config: ${{ matrix.profile }}
      ksu_ref: ""
      hook_mode: config
      susfs: config
      publish_release: false
    permissions:
      contents: read

  # ------------------------------------------------------------------ release
  # Collect all artifacts from the matrix builds and publish a single Release.
  release:
    name: Publish combined release
    needs: build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set build date
        id: date
        run: echo "build_date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Organize and package artifacts
        run: |
          set -euo pipefail
          mkdir -p release

          {
            echo "### Artifacts downloaded:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Each artifact is a directory under artifacts/.
          # Package AnyKernel3 dirs into zips, copy raw files alongside.
          shopt -s nullglob
          for dir in artifacts/*/; do
            name=$(basename "${dir%/}")
            echo "- $name" >> "$GITHUB_STEP_SUMMARY"

            # If the artifact looks like an AnyKernel3 dir (has anykernel.sh or tools/),
            # zip it as a flashable package.
            if [ -f "${dir}anykernel.sh" ] || [ -d "${dir}tools" ]; then
              (cd "$dir" && zip -qr9 "${GITHUB_WORKSPACE}/release/${name}.zip" .)
              echo "  -> packaged as ${name}.zip"
            else
              # Copy individual files (Image, boot.img, dtbo.img, *.ko, etc.)
              for f in "${dir}"*; do
                [ -f "$f" ] && cp "$f" "release/$(basename "$f")"
              done
            fi
          done

          # List final release contents
          {
            echo ""
            echo "### Release contents:"
            echo ""
            echo '```'
            ls -la release/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create combined release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: gki-all-${{ steps.date.outputs.build_date }}
          name: GKI All Profiles · ${{ steps.date.outputs.build_date }}
          body: |
            ## GKI KernelSU-Next + SUSFS — All Profiles Build

            **Build date:** ${{ steps.date.outputs.build_date }}
            **Profiles built:** 5

            ### Downloads

            Each `AnyKernel3-*.zip` is a flashable package for the corresponding GKI kernel version.
            Pick the one matching your device's Android / kernel version:

            | File | Kernel | Android |
            | --- | --- | --- |
            | AnyKernel3-*-android13-5.10-* | Linux 5.10 | Android 13 |
            | AnyKernel3-*-android13-5.15-* | Linux 5.15 | Android 13 |
            | AnyKernel3-*-android14-6.1-*  | Linux 6.1  | Android 14 |
            | AnyKernel3-*-android15-6.6-*  | Linux 6.6  | Android 15 |
            | AnyKernel3-*-android16-6.12-* | Linux 6.12 | Android 16 |

            ### Flashing

            1. Flash the `AnyKernel3-*.zip` from a custom recovery (TWRP/OrangeFox) or with KernelFlasher.
            2. After boot, install the [KernelSU-Next manager](https://github.com/KernelSU-Next/KernelSU-Next/releases).
            3. Load SUSFS: `ksud insmod /data/adb/ksu/susfs_guard_lkm.ko`

            ### Notes

            - These are **generic GKI** kernels — they work on devices whose boot partition
              accepts a GKI kernel (Pixel, most GSI/custom-ROM phones). Device-specific vendor
              kernels (OnePlus, Samsung, etc.) need a separate profile under `config/`.
            - SUSFS is built as an LKM (`susfs_guard_lkm.ko`) and loaded at runtime; it is
              included inside each AnyKernel3 zip under `/data/adb/ksu/`.
            - Built automatically every Monday 10:00 CST, or on manual trigger.
          files: release/*
          make_latest: true
