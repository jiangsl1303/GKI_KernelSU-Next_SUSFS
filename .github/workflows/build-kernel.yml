name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config file to build (path relative to repo root)"
        required: false
        default: "config.env"
        type: string
      ksu_ref:
        description: "KernelSU-Next branch/tag/commit (blank = auto: dev on >=5.10, legacy below)"
        required: false
        default: ""
        type: string
      hook_mode:
        description: "Syscall hook mechanism (auto resolves per kernel version)"
        required: false
        default: "config"
        type: choice
        options: [config, auto, kprobes, manual, none]
      susfs:
        description: "Build and bundle the SUSFS 2.3 LKM (susfs_guard_lkm.ko)"
        required: false
        default: "config"
        type: choice
        options: [config, "true", "false"]
      extra_defconfig:
        description: "Extra defconfig lines, space separated (e.g. CONFIG_TMPFS_XATTR=y)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish the build as a GitHub Release"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      config:          { required: false, default: "config.env", type: string }
      ksu_ref:         { required: false, default: "",           type: string }
      hook_mode:       { required: false, default: "config",     type: string }
      susfs:           { required: false, default: "config",     type: string }
      extra_defconfig: { required: false, default: "",           type: string }
      publish_release: { required: false, default: false,        type: boolean }

concurrency:
  group: build-kernel-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      device: ${{ steps.meta.outputs.device }}
      build_time: ${{ steps.meta.outputs.build_time }}
      kernel_release: ${{ steps.meta.outputs.kernel_release }}
      ksu_name: ${{ steps.meta.outputs.ksu_name }}
      ksu_version: ${{ steps.meta.outputs.ksu_version }}
      susfs_version: ${{ steps.meta.outputs.susfs_version }}
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: ${{ inputs.config }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

      # workflow inputs -> IN_* overrides consumed by scripts/config.sh
      IN_KSU_VARIANT: kernelsu-next
      IN_KSU_REF: ${{ inputs.ksu_ref }}
      IN_KSU_HOOK_MODE: ${{ inputs.hook_mode }}
      IN_ENABLE_SUSFS: ${{ inputs.susfs }}
      IN_EXTRA_DEFCONFIG: ${{ inputs.extra_defconfig }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve configuration
        run: bash scripts/config.sh

      - name: Free up disk space
        if: env.REMOVE_UNUSED_PACKAGES == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap space
        run: |
          # LTO links are memory-hungry and the runner has 16GB.
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev
          mkdir -p "$WORKSPACE"

      - name: Set up toolchain
        run: bash scripts/toolchain.sh

      - name: Fetch kernel source
        run: bash scripts/source.sh

      - name: Install KernelSU-Next
        if: env.KSU_VARIANT != 'none'
        run: bash scripts/kernelsu.sh

      - name: Apply kernel patches
        run: bash scripts/patches.sh

      - name: Set up ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ env.DEVICE }}-${{ env.KSU_VARIANT }}-${{ env.KSU_REF_RESOLVED }}
          max-size: 2G

      - name: Build kernel
        run: bash scripts/build.sh all

      - name: Package artifacts
        run: bash scripts/package.sh all

      - name: Export build metadata
        id: meta
        run: |
          {
            echo "device=${DEVICE}"
            echo "build_time=${BUILD_TIME}"
            echo "ksu_name=${KSU_NAME:-none}"
            echo "ksu_version=${KSU_VERSION_LABEL:-}"
            echo "kernel_release=${KERNEL_RELEASE:-}"
            echo "susfs_version=${SUSFS_VERSION:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-GKI${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error

      - name: Upload kernel image
        if: env.CHECK_FILE_IS_OK == 'true' && env.UPLOAD_RAW_IMAGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Image-GKI${{ env.LOCALVERSION }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}
          if-no-files-found: error

      - name: Upload SUSFS LKM
        if: env.SUSFS_KO != ''
        uses: actions/upload-artifact@v4
        with:
          name: susfs_guard_lkm-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: ${{ env.SUSFS_KO }}
          if-no-files-found: error

      - name: Upload DTBO image
        if: env.CHECK_DTBO_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img

      - name: Upload boot image
        if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: boot-GKI${{ env.LOCALVERSION }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/boot.img

  # Publishing is a separate job so the build runs with a read-only token;
  # only this job gets contents:write, and only when asked for.
  release:
    name: Publish release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Package AnyKernel3 as a flashable zip
        run: |
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/AnyKernel3*/; do
            name=$(basename "${dir%/}")
            (cd "$dir" && zip -qr9 "${GITHUB_WORKSPACE}/release/${name}.zip" .)
            echo "packed ${name}.zip"
          done
          for f in artifacts/*/Image* artifacts/*/boot.img artifacts/*/dtbo.img artifacts/*/*.ko; do
            [ -f "$f" ] && cp "$f" release/
          done
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ needs.build.outputs.device }}-${{ needs.build.outputs.build_time }}
          name: ${{ needs.build.outputs.device }} · ${{ needs.build.outputs.ksu_name }} ${{ needs.build.outputs.ksu_version }} · ${{ needs.build.outputs.build_time }}
          body: |
            | | |
            | --- | --- |
            | Profile | `${{ inputs.config }}` |
            | Kernel | `${{ needs.build.outputs.kernel_release }}` |
            | KernelSU | `${{ needs.build.outputs.ksu_name }}` @ `${{ needs.build.outputs.ksu_version }}` |
            | SUSFS | `${{ needs.build.outputs.susfs_version || 'not applied' }}` |
            | KernelSU manager (if missing) | https://github.com/KernelSU-Next/KernelSU-Next/releases |

            Flash `AnyKernel3-*.zip` from a custom recovery, or with KernelFlasher.
            After boot: `ksud insmod /data/adb/ksu/susfs_guard_lkm.ko`
          files: release/*
